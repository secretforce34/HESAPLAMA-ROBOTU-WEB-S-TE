# Her ay TÜFE (TÜİK/TCMB), döviz (TCMB) ve altın (Dünya Bankası) serilerini günceller.
# TÜİK verisi ayın 3'ünde açıklanır; görev 4'ünde ve yedek olarak 6'sında çalışır.
# Değişiklik varsa JSON dosyaları kaydedilir; "Siteyi yayınla" görevi bunu dinleyip siteyi yeniden derler.
name: Veri güncelle

on:
  schedule:
    - cron: '0 9 4 * *'
    - cron: '0 9 6 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verileri indir
        run: node scripts/veri/guncelle.mjs

      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- src/data/series; then
            echo "Yeni veri yok."
            exit 0
          fi
          git config user.name "hesap-robotu-veri"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/series
          git commit -m "Aylık veri güncellemesi: $(date -u +%Y-%m-%d)"
          git push
